server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trading-intelligence-system

  # In-Memory H2 Database (MySQL Mode) with Zero-Setup / Configurable via Environment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # H2 Web Console (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Spring AI Ollama Settings (Local LLM / Nosana Remote GPU Node)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        model: ${CHAT_MODEL:qwen2.5:14b}
        options:
          model: ${CHAT_MODEL:qwen2.5:14b}
          temperature: 0.1
      embedding:
        enabled: true
        model: ${EMBEDDING_MODEL:bge-m3:latest}
        options:
          model: ${EMBEDDING_MODEL:bge-m3:latest}
    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: ${CHROMADB_HOST:http://localhost}
          port: ${CHROMADB_PORT:8000}
        collection-name: ${CHROMADB_COLLECTION:financial-market-news}
        initialize-schema: false

# Custom Trading System Settings
trading:
  scoring:
    quant-weight: 0.6
    qual-weight: 0.4
    divergence-threshold: 0.5
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    daily-limit: ${RATE_LIMIT_DAILY_LIMIT:3} # 일일 무료 AI 분석 횟수 제한

# Bright Data Web Intelligence & Realtime Scraping API
brightdata:
  api-key: ${BRIGHTDATA_API_KEY:4a62ad76-a8e4-46cb-9cb0-deaf9e6587a7}
  base-url: ${BRIGHTDATA_BASE_URL:https://api.brightdata.com}
  enabled: ${BRIGHTDATA_ENABLED:true}

