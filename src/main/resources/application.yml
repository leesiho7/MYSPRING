server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trading-intelligence-system

  datasource:
    url: jdbc:mysql://localhost:3306/springai?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Spring AI Ollama Settings (Local LLM)
  ai:
    ollama:
      base-url: https://3zZzp5QZ2YkMoRB89g7B7BR23R7FH8oDR5A2qyEJsRXL.node.k8s.prd.nos.ci
      chat:
        enabled: true
        options:
          model: llama3:latest
          temperature: 0.2
      embedding:
        enabled: true
        options:
          model: nomic-embed-text:latest
    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: financial-market-news
        initialize-schema: false

# Custom Trading System Settings
trading:
  scoring:
    quant-weight: 0.6
    qual-weight: 0.4
    divergence-threshold: 0.5
  rate-limit:
    enabled: true
    daily-limit: 3 # 일일 무료 AI 분석 횟수 제한 (언제든 5, 10회로 상향 가능)

# Bright Data Web Intelligence & Realtime Scraping API
brightdata:
  api-key: 4a62ad76-a8e4-46cb-9cb0-deaf9e6587a7
  base-url: https://api.brightdata.com
  enabled: true

