server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trading-intelligence-system

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:springai}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Spring AI Ollama Settings (Local LLM / Nosana Remote GPU Node)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        model: ${CHAT_MODEL:qwen2.5:14b}
        options:
          model: ${CHAT_MODEL:qwen2.5:14b}
          temperature: 0.1
      embedding:
        enabled: true
        model: ${EMBEDDING_MODEL:bge-m3:latest}
        options:
          model: ${EMBEDDING_MODEL:bge-m3:latest}
    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: ${CHROMADB_HOST:http://localhost}
          port: ${CHROMADB_PORT:8000}
        collection-name: ${CHROMADB_COLLECTION:financial-market-news}
        initialize-schema: false

# Custom Trading System Settings
trading:
  scoring:
    quant-weight: 0.6
    qual-weight: 0.4
    divergence-threshold: 0.5
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    daily-limit: ${RATE_LIMIT_DAILY_LIMIT:3} # 일일 무료 AI 분석 횟수 제한

# Bright Data Web Intelligence & Realtime Scraping API
brightdata:
  api-key: ${BRIGHTDATA_API_KEY:4a62ad76-a8e4-46cb-9cb0-deaf9e6587a7}
  base-url: ${BRIGHTDATA_BASE_URL:https://api.brightdata.com}
  enabled: ${BRIGHTDATA_ENABLED:true}

