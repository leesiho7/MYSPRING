server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trading-intelligence-system

  # Database Configuration (MySQL 기본 지원 및 환경변수 오버라이딩 가능)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trading_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # Spring AI Ollama Settings (Local LLM / Nosana Remote GPU Node)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        model: ${CHAT_MODEL:qwen2.5:3b}
        options:
          model: ${CHAT_MODEL:qwen2.5:3b}
          temperature: 0.1
      embedding:
        enabled: true
        model: ${EMBEDDING_MODEL:bge-m3:latest}
        options:
          model: ${EMBEDDING_MODEL:bge-m3:latest}

    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: ${CHROMADB_HOST:http://localhost}
          port: ${CHROMADB_PORT:8000}
        collection-name: ${CHROMADB_COLLECTION:financial-market-news}
        initialize-schema: false

# Custom Trading System Settings
trading:
  scoring:
    quant-weight: 0.6
    qual-weight: 0.4
    divergence-threshold: 0.5
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    daily-limit: ${RATE_LIMIT_DAILY_LIMIT:1000} # 일일 무료 AI 분석 횟수 제한

# Bright Data Web Intelligence & Realtime Scraping API
brightdata:
  api-key: ${BRIGHTDATA_API_KEY:4a62ad76-a8e4-46cb-9cb0-deaf9e6587a7}
  base-url: ${BRIGHTDATA_BASE_URL:https://api.brightdata.com}
  enabled: ${BRIGHTDATA_ENABLED:true}

# RAG & VectorStore Hybrid Search Configuration
rag:
  vectorstore:
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
    top-k: ${RAG_TOP_K:3}

# Blockchain Webhook & Crypto Payment Settings (Tatum, QuickNode, Alchemy)
blockchain:
  webhook:
    secret: ${CRYPTO_WEBHOOK_SECRET:aether_super_secret_webhook_key_2026}
    enabled: true
  license:
    secret-key: ${LICENSE_TOKEN_SECRET_KEY:aether_trading_ai_super_secret_license_salt_999}
    duration-days: 30
    monthly-price-usdt: 7.0
  deposit:
    addresses:
      polygon: ${DEPOSIT_WALLET_POLYGON:0x71C8364f3B80430C4361b17b2F3057173b0638A9}
      bsc: ${DEPOSIT_WALLET_BSC:0x71C8364f3B80430C4361b17b2F3057173b0638A9}
      trc20: ${DEPOSIT_WALLET_TRC20:TYDzsYUE282QJ84qjxoKqT5wD3ZgK8ZABC}
      solana: ${DEPOSIT_WALLET_SOLANA:7Xv9BfV4U932pQZ9USDT4444444444444444444444444444}


# Official Telegram Bot Configuration (1:1 Personal Deep Linking)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:mock_bot_token_123456789:ABCdefGHIjklMNOpqrsTUVwxyz}
    username: ${TELEGRAM_BOT_USERNAME:AetherQuantOfficialBot}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:https://api.aether-trading.com/api/v1/telegram/webhook}
    mock-mode: ${TELEGRAM_MOCK_MODE:true} # 테스트/로컬 환경에서는 콘솔 로깅으로 Mock 동작

# Quant Bot Virtual Instance / Docker Provisioning
bot:
  hosting:
    mode: ${BOT_HOSTING_MODE:HYBRID} # DOCKER, PROCESS, MOCK, HYBRID
    docker:
      image: ${QUANT_BOT_DOCKER_IMAGE:python:3.11-slim}
      network: ${QUANT_BOT_DOCKER_NETWORK:bridge}
      memory-limit: "512m"
      cpu-limit: "1.0"

# Cryptomus Crypto Payment & Payout API Gateway
cryptomus:
  merchant-id: ${CRYPTOMUS_MERCHANT_ID:mock_merchant_uuid_12345678}
  payment-key: ${CRYPTOMUS_PAYMENT_API_KEY:mock_payment_api_key_abcdef123456}
  payout-key: ${CRYPTOMUS_PAYOUT_API_KEY:mock_payout_api_key_7890ghijklmn}
  base-url: ${CRYPTOMUS_BASE_URL:https://api.cryptomus.com}
  callback-url: ${CRYPTOMUS_CALLBACK_URL:https://api.aether-trading.com/api/v1/payments/cryptomus/webhook}
  mock-mode: ${CRYPTOMUS_MOCK_MODE:true} # 로컬/테스트 환경에서 Mock 모드 지원


