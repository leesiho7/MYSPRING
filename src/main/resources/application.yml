server:
  port: ${SERVER_PORT:8080}
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: trading-intelligence-system
  # MySQL Database Configuration (현재 H2로 대체)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  # Spring AI Ollama Settings (Local LLM / Nosana Remote GPU Node)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        model: ${CHAT_MODEL:qwen2.5:14b}
        options:
          model: ${CHAT_MODEL:qwen2.5:14b}
          temperature: 0.1
      embedding:
        enabled: true
        model: ${EMBEDDING_MODEL:bge-m3:latest}
        options:
          model: ${EMBEDDING_MODEL:bge-m3:latest}
    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: ${CHROMADB_HOST:http://localhost}
          port: ${CHROMADB_PORT:8000}
        collection-name:
