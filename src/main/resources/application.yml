server:
  port: 8080

spring:
  application:
    name: trading-intelligence-system

  datasource:
    url: jdbc:mysql://localhost:3306/springai?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Spring AI Ollama Settings (Local LLM)
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: true
        options:
          model: llama3:latest
          temperature: 0.2
    # Spring AI ChromaDB Vector Store
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: financial-market-news
        initialize-schema: false

# Custom Trading System Settings
trading:
  scoring:
    quant-weight: 0.6
    qual-weight: 0.4
    divergence-threshold: 0.5
